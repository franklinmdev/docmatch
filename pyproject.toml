# Workspace root. The engine is the only Python member; apps/review is Node.
[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.7,<0.17",
]

[tool.ruff]
target-version = "py312"
src = ["engine/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-ra"
testpaths = ["engine"]
