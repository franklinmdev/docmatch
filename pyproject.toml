# Workspace root. The engine is the only Python member; apps/review is Node.
[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.7,<0.17",
    "scipy-stubs>=1.18,<2",
]

[tool.ruff]
target-version = "py312"
src = ["engine/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# mypy 2.3.1, docs read 2026-09-11. Nothing here is suppressed: the engine
# passes as written, and `engine/src` holds no `type: ignore` and no `Any`.
#
# `strict` plus `warn_unreachable` is where this stops. The three
# `disallow_any_*` flags above strict also pass today, and are still left off on
# purpose: they cost nothing until phase 1 adds provider SDKs, and then they bill
# every untyped boundary at once, which is an argument to have then, not a
# setting to inherit now. `disallow_any_expr` is the one flag that does not pass,
# and its 21 findings are all third-party: `@pytest.fixture`, `re.Match`
# subscripts, `argparse.Namespace` attributes. None of them is this engine's
# code, so the flag measures typeshed, not us.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["engine/src"]
plugins = ["pydantic.mypy"]

# The plugin is not optional here. Without it mypy builds a model's `__init__`
# from the field aliases and does not know `populate_by_name`, so it rejects
# `Annotation(fields=..., cells=...)`. With it, every argument defaults to `Any`,
# which is how a dict reached a field declared as `DocumentMetadata`;
# `init_typed` is what closes that, and coercion stays at the JSON boundary,
# where the input is untyped anyway. `init_forbid_extra` is the other half: it
# turns a typo'd keyword into "did you mean page_count?" instead of silence. It
# constrains the synthesized `__init__` only, so `DocumentMetadata` still ignores
# unknown keys when it validates a real annotation file, as its docstring says.
# https://docs.pydantic.dev/latest/integrations/mypy/, pydantic 2.13.5.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-ra"
testpaths = ["engine"]
