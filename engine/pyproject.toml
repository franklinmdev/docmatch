[project]
name = "docmatch"
version = "0.0.0"
description = "Document reconciliation engine: extract, validate, match, review, measure."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5,<3",
]

[project.scripts]
docmatch = "docmatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
