[project]
name = "docmatch"
version = "0.0.0"
description = "Document reconciliation engine: extract, validate, match, review, measure."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2,<2",
    "google-genai>=2.23,<3",
    "openai>=3.14.1,<4",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.13.5,<3",
    "pypdfium2>=5.13,<6",
    "scipy>=1.18,<2",
    "sentence-transformers>=6.1.0,<7",
    "torch>=2.2,<3",
]

[project.scripts]
docmatch = "docmatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

# Torch from PyTorch's CPU index, never PyPI: on Linux the PyPI wheel targets
# CUDA and drags the nvidia libraries into every install, CI's included, and
# nothing here runs on a GPU. `explicit` keeps the index to torch alone.
# uv guide read 2026-09-21 (docs.astral.sh/uv/guides/integration/pytorch/),
# uv 0.12.13.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
