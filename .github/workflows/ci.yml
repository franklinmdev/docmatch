name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    # Every push, plus pull requests from forks. Pull requests from a branch of
    # this repository are already covered by the push event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true

      # No dataset is downloaded here: the tests run on committed synthetic
      # annotations, and DocILE may not be redistributed.
      - name: Install the engine
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # The eval on the committed synthetic subset: six documents in DocILE's
      # shape with predictions to match, so the whole path from manifest to
      # report runs on every push while the real dataset never leaves the
      # machine it was downloaded on. The numbers this prints are the
      # harness's own, not a benchmark; the README's numbers come from the
      # same command run locally against `data/docile`.
      - name: Eval
        run: >-
          uv run docmatch eval
          --data-dir engine/tests/evals/synthetic
          --manifest engine/tests/evals/synthetic/subset.json
          --predictions engine/tests/evals/synthetic/predictions.json

      # The matching report on the same synthetic subset: cases generated
      # from its labels at the real sizes, matched and scored, then matched
      # again with the fixture's saved readings as the invoices, so the whole
      # path from labels and readings to report runs on every push. It only
      # prints; the README's matching numbers come from the same command run
      # locally.
      - name: Match
        run: >-
          uv run docmatch match
          --data-dir engine/tests/evals/synthetic
          --manifest engine/tests/evals/synthetic/subset.json
          --run engine/tests/evals/synthetic

  docs-location:
    name: docs location
    runs-on: ubuntu-latest
    # Same events as the checks above.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Markdown lives in docs/, beside the root canonicals; the allowlist in
      # .claude/docs-allowlist adds this repo's exceptions.
      - name: Check markdown location
        run: bash scripts/check-docs-location.sh
