name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    # Every push, plus pull requests from forks. Pull requests from a branch of
    # this repository are already covered by the push event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # The Postgres the resolution tests and the Resolve step run against:
    # pgvector's own image at a pinned pair, so the versions on a CI row are
    # never confused with the named machine's 16.15 and 0.6.0. The job runs
    # on the runner rather than in a container, so the port is mapped and the
    # host is localhost.
    # Trust authentication, which the image documents as the way to run
    # without a password: the container lives for one job on one runner,
    # and a made-up password in the URL only trips secret scanners.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DOCMATCH_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true

      # No dataset is downloaded here: the tests run on committed synthetic
      # annotations, and DocILE may not be redistributed.
      - name: Install the engine
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      # Both extensions have to exist before a run; creating them is the
      # cluster's business, not the command's, which only checks. The image
      # ships both, and the runner image ships the client.
      - name: Prepare the database
        run: >-
          psql "$DOCMATCH_DATABASE_URL"
          -c "CREATE EXTENSION IF NOT EXISTS vector"
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      # DGII's e-CF XSDs v1.0 of 16/10/2025, which the fixture's made-up
      # e-CFs are validated against. They are not committed (DGII states no
      # terms for redistributing them), so they are downloaded once and
      # cached; the test checks each against its pinned sha256. DGII refuses
      # curl's default user agent (#217), hence a browser's.
      - name: Cache the e-CF XSDs
        id: xsds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dgii-ecf-xsd
          key: dgii-ecf-xsd-v1.0-2025-10-16

      - name: Download the e-CF XSDs
        if: steps.xsds.outputs.cache-hit != 'true'
        run: |
          base="https://dgii.gov.do/cicloContribuyente/facturacion/comprobantesFiscalesElectronicosE-CF/Documentacin%20sobre%20eCF/Documentaci%C3%B3n%20T%C3%A9cnica%20(XSD)"
          mkdir -p ${{ runner.temp }}/dgii-ecf-xsd
          for kind in 31 32 41 43; do
            curl --fail --silent --show-error --location \
              --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              --output ${{ runner.temp }}/dgii-ecf-xsd/e${kind}.xsd \
              "${base}/e-CF%20${kind}%20v.1.0.xsd"
          done

      - name: Test
        run: uv run pytest
        env:
          DOCMATCH_ECF_XSDS: ${{ runner.temp }}/dgii-ecf-xsd

      # The eval on the committed synthetic subset: six documents in DocILE's
      # shape with predictions to match, so the whole path from manifest to
      # report runs on every push while the real dataset never leaves the
      # machine it was downloaded on. The numbers this prints are the
      # harness's own, not a benchmark; the README's numbers come from the
      # same command run locally against `data/docile`. The corrections
      # section scores a committed export a review of the fixture's replay
      # loop left, synthetic like the rest (#25), never in either number.
      - name: Eval
        run: >-
          uv run docmatch eval
          --data-dir engine/tests/evals/synthetic
          --manifest engine/tests/evals/synthetic/subset.json
          --predictions engine/tests/evals/synthetic/predictions.json
          --corrections engine/tests/evals/synthetic/corrections.json

      # DGII's 606 pre-validator for the Regional step (#229). DGII's binary
      # is never committed: it is downloaded once with a browser's user agent
      # (DGII refuses curl's default, #217), checked against the SHA-256
      # `prevalidate 606` pins, and cached by that hash, so a republished zip
      # misses the cache and fails the check rather than moving the number.
      - name: Cache the 606 pre-validator
        id: prevalidator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dgii-prevalidator
          key: dgii-prevalidator-130affffbdb3f2f3a6e344564d47f88f1d7381436e7ed8c57cba299504a091e6

      - name: Download the 606 pre-validator
        if: steps.prevalidator.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/dgii-prevalidator
          curl --fail --silent --show-error --location \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            --referer "https://dgii.gov.do/herramientas/formularios/pre-validacion/" \
            --output ${{ runner.temp }}/dgii-prevalidator/Pre_Validado.zip \
            "https://dgii.gov.do/herramientas/formularios/pre-validacion/Documents/Pre_Validado.zip"
          echo "130affffbdb3f2f3a6e344564d47f88f1d7381436e7ed8c57cba299504a091e6  ${{ runner.temp }}/dgii-prevalidator/Pre_Validado.zip" \
            | sha256sum --check

      # The regional set's report: four made-up Dominican comprobantes,
      # their labels.csv and a saved run of made-up readings, scored over the
      # fieldtypes the set covers only. A real set is the owner's, never
      # committed, and is scored locally with the same command. It only prints;
      # pytest pins what it prints. Then the same run's 606, from its readings
      # and from its labels, one file per month on each side, written to a
      # scratch directory. Then DGII's own pre-validator over those files, in
      # the pinned Mono container with no network; pytest pins what it
      # prints from captured output and never runs the container.
      - name: Regional
        run: |
          uv run docmatch eval \
            --manifest engine/tests/evals/regional/do/manifest.json \
            --predictions engine/tests/evals/regional/run/predictions.json
          uv run docmatch export 606 \
            --manifest engine/tests/evals/regional/do/manifest.json \
            --run engine/tests/evals/regional/run \
            --out ${{ runner.temp }}/606
          uv run docmatch prevalidate 606 \
            --export ${{ runner.temp }}/606 \
            --binary ${{ runner.temp }}/dgii-prevalidator/Pre_Validado.zip

      # The e-CF set's report: four made-up e-CFs, one of each type the
      # parser reads, with their hand-written labels and the parser's saved
      # run. Its F1 is parsing, not reading a page, and the report says so.
      - name: Regional e-CF
        run: >-
          uv run docmatch eval
          --manifest engine/tests/evals/regional/ecf/manifest.json
          --predictions engine/tests/evals/regional/ecf-run/predictions.json

      # The matching report on the same synthetic subset: cases generated
      # from its labels at the real sizes, matched and scored, then matched
      # again with the fixture's saved readings as the invoices, so the whole
      # path from labels and readings to report runs on every push. It only
      # prints; the README's matching numbers come from the same command run
      # locally.
      - name: Match
        run: >-
          uv run docmatch match
          --data-dir engine/tests/evals/synthetic
          --manifest engine/tests/evals/synthetic/subset.json
          --run engine/tests/evals/synthetic

      # The smoke half of reproducing a row: the per-type table rebuilt from
      # the same synthetic labels and compared, exactly, with the synthetic
      # half of benchmark/matching.json, so the command a reader runs first
      # cannot rot unnoticed. It exits nonzero on any differing cell. The
      # docile half needs the real labels and is compared locally.
      - name: Reproduce
        run: uv run docmatch reproduce synthetic

      # The embedder the Resolve step loads, cached by its pinned revision so
      # the weights download once and a bump of the pin misses on purpose.
      # The key is read from the code, so it never drifts from it. Only the
      # Resolve step touches the cache: every test drives the arms with a
      # fake, so pytest loads no weights.
      - name: Name the pinned embedder
        id: embedder
        run: >-
          uv run python -c
          "from docmatch.resolution.models import EMBEDDER_REVISION as r;
          print(f'revision={r}')"
          >> "$GITHUB_OUTPUT"

      - name: Cache the embedder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-${{ steps.embedder.outputs.revision }}

      # The resolution report on the same fixture: the catalog its train
      # split yields, rebuilt in the service container and answered by every
      # arm with the real models, so the whole path from labels to report
      # runs on every push. It only prints, and its latency means nothing
      # here; the README's resolution numbers come from the same command run
      # locally on the named machine.
      - name: Resolve
        run: >-
          uv run docmatch resolve
          --data-dir engine/tests/evals/synthetic

      # The loop on the same fixture: one case per document with labeled
      # lines, uploaded through a real server on a new schema in the service
      # container, read by replay from the fixture's own loop run, so the
      # whole path from upload to report runs on every push with no new
      # service and no vendor call. Then the report on the saved file alone.
      # Both only print; pytest pins what is deterministic, and latency here
      # means nothing.
      - name: Pipeline
        run: |
          uv run docmatch loop --backend replay \
            --run engine/tests/evals/synthetic/runs/loop \
            --data-dir engine/tests/evals/synthetic \
            --manifest engine/tests/evals/synthetic/runs/loop/manifest.json \
            --copies engine/tests/evals/synthetic/copies \
            --out "$RUNNER_TEMP/loop"
          uv run docmatch loop --backend labels \
            --data-dir engine/tests/evals/synthetic \
            --manifest engine/tests/evals/synthetic/runs/loop/manifest.json \
            --copies engine/tests/evals/synthetic/copies \
            --out "$RUNNER_TEMP/labels"
          uv run docmatch pipeline --run "$RUNNER_TEMP/loop" \
            --run "$RUNNER_TEMP/labels"

  docs-location:
    name: docs location
    runs-on: ubuntu-latest
    # Same events as the checks above.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Markdown lives in docs/, beside the root canonicals; the allowlist in
      # .claude/docs-allowlist adds this repo's exceptions.
      - name: Check markdown location
        run: bash scripts/check-docs-location.sh
