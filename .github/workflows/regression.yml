name: Regression

# A pull request may not lower field F1 or line-item F1 on any backend (#153).
# The numbers come from the fixed subset, which never reaches a runner (#25),
# so the local eval commits them in benchmark/aggregate.json and this compares
# that file with the one at the merge base, and checks it was produced on the
# code the pull request carries. `docmatch.regression` explains the rules.
#
# Pull request events only, since the gate reads the pull request's label and
# body: labeled, unlabeled and edited rerun it when the regression-accepted
# label or the reason section changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression gate
    runs-on: ubuntu-latest
    steps:
      # The pull request's own head rather than the merge commit GitHub makes,
      # since the aggregate was produced on the head; the whole history, for
      # the merge base and the files it holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install the engine
        run: uv sync --locked

      # Prints every backend's two numbers before and after, what the change
      # owed, anything stale and the extraction noise, and fails unless it
      # passes.
      - name: Compare the aggregate with the merge base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run docmatch regression
          --base "$BASE"
          --head "$HEAD"
          --event "$GITHUB_EVENT_PATH"
