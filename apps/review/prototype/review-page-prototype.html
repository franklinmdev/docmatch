<title>docmatch review prototype</title>
<!--
PROTOTYPE, throwaway. Ticket #156: what the review page shows, and how a reviewer approves or corrects.
Three structurally different layouts on one page, switched from the bottom bar (or the arrow keys):
  A  Split: page on the left, reading and findings on the right.
  B  Ledger: purchase order, receipt and invoice side by side per line; the page is a sheet.
  C  Walk-through: one routing reason or finding at a time, then decide.
  D  Chosen with the owner: B's ledger with A's page pinned beside it, confidence as a gray number,
     a failed extraction approved or rejected on the page alone, a confirmation only when approving with something open.
All data is invented. No DocILE content. State lives in memory; the gate and the match rerun in the page
after every edit so the rerun of #150 point 5 can be felt. Accent hue is a placeholder, not a slot decision.
-->

    return `<tr class="${hot?"hot":""}"><td class="side mono" style="padding:8px 6px">${p.id}</td><td class="side" style="padding:8px 6px;min-width:170px">${esc(p.desc)}</td><td class="side num" style="padding:8px 6px">${p.qty}</td><td class="side mono" style="padding:8px 6px">${esc(p.unit)}</td><td class="side num" style="padding:8px 6px">${money(p.price)}</td>
      <td class="gap"></td><td class="side num" style="padding:8px 6px">${d.receipt[p.id]}</td><td class="gap"></td>${invCells(l)}
      <td class="fnd">${fs.map(f=>`<div>${sevChip(f)} <b>${esc(f.type)}</b><div class="conf">${esc(f.expl)}</div></div>`).join("")||(l?`<span class="chip ok">agrees</span>`:"")}${res?`<div style="margin-top:4px">${res.sku?`<span class="chip">${res.sku}</span> <span class="conf">${res.score.toFixed(2)}</span>`:`<span class="chip note">no entry</span> <span class="conf">${res.score.toFixed(2)}</span>`}</div>`:""}</td>
      <td>${l?`<button class="btn ghost sm" data-rm="${l.key}" ${s.decided?"disabled":""}>Remove</button>`:""}</td></tr>`;
  }).join("");
  const extra=m.findings.filter(f=>f.type==="extra line").map(f=>{const l=s.reading.lines.find(x=>x.key===f.key);return `<tr class="hot"><td class="side muted" colspan="5" style="padding:8px 6px">no purchase-order line</td><td class="gap"></td><td class="side"></td><td class="gap"></td>${invCells(l)}<td class="fnd">${sevChip(f)} <b>extra line</b><div class="conf">${esc(f.expl)}</div></td><td><button class="btn ghost sm" data-rm="${l.key}" ${s.decided?"disabled":""}>Remove</button></td></tr>`}).join("");
  const removed=s.reading.lines.filter(l=>l.removed).map(l=>`<tr class="removed"><td colspan="8" class="muted" style="padding:8px 6px">removed from the reading</td>${invCells(l)}<td></td><td><button class="btn ghost sm" data-rm="${l.key}" ${s.decided?"disabled":""}>Restore</button></td></tr>`).join("");
  const table=`<div class="scroll-x panel"><table class="ledger"><thead>
    <tr><th class="grp" colspan="5">Purchase order ${esc(d.po.number)}</th><th class="gap"></th><th class="grp">Receipt</th><th class="gap"></th><th class="grp" colspan="5">Invoice, as read (editable)</th><th class="grp">Finding and catalog</th><th></th></tr>
    <tr><th>Line</th><th>Description</th><th class="num">Qty</th><th>Unit</th><th class="num">Price</th><th class="gap"></th><th class="num">Qty</th><th class="gap"></th><th>Description</th><th class="num">Qty</th><th>Unit</th><th class="num">Price</th><th class="num">Amount</th><th></th><th></th></tr></thead>
    <tbody>${rows}${extra}${removed}</tbody></table></div>
    <div style="padding:8px 0"><button class="btn sm" data-act="addline" ${s.decided?"disabled":""}>Add a line to the reading</button></div>`;
  return head+hdr+table+decideBar(d,s)+sh;
}
function renderD(d,s){
  S.pinned=true; const inner=renderB(d,s); S.pinned=false;
  return `<div class="d-grid"><div class="d-main">${inner}</div><aside class="d-page"><details open><summary class="label" style="cursor:pointer;padding:4px 0">Page 1 of 1</summary>${paper(d,[])}</details></aside></div>`;
}
function sheet(d,s){
  return `<div class="sheet-scrim" data-act="sheet"></div><aside class="sheet" aria-label="Scanned page"><div class="row-flex" style="justify-content:space-between;margin-bottom:12px"><h2>Page 1 of 1</h2><button class="btn sm" data-act="sheet">Close</button></div>${paper(d,[])}</aside>`;
}

// ---------- Variant C: walk-through ----------
function cItems(d,s){
  if(!s.reading) return [{id:"fail",title:"Extraction failed",kind:"fail"},{id:"decide",title:"Decide",kind:"decide"}];
  const g=gate(s), m=match(d,s), items=[];
  g.rules.filter(r=>!r.ok).forEach(r=>items.push({id:"g:"+r.rule,title:"Gate: "+r.rule,kind:"gate",rule:r}));
  // keep cleared gate items visible once they were there
  (s._cSeen||[]).forEach(id=>{if(id.startsWith("g:")&&!items.find(x=>x.id===id))items.push({id,title:"Gate: "+id.slice(2),kind:"gate",cleared:true,rule:g.rules.find(r=>"g:"+r.rule===id)})});
  m.findings.forEach(f=>items.push({id:`f:${f.type}:${f.place}`,title:`${f.type[0].toUpperCase()+f.type.slice(1)}, ${f.place}`,kind:"finding",f}));
  (s._cSeen||[]).forEach(id=>{if(id.startsWith("f:")&&!items.find(x=>x.id===id)){const [,type,place]=id.split(":");items.push({id,title:`${type[0].toUpperCase()+type.slice(1)}, ${place}`,kind:"finding",cleared:true})}});
  s._cSeen=[...new Set([...(s._cSeen||[]),...items.map(i=>i.id)])];
  items.push({id:"decide",title:"Decide",kind:"decide"});
  return items;
}
function renderC(d,s){
  const items=cItems(d,s); if(S.cStep>=items.length)S.cStep=items.length-1;
  const cur=items[S.cStep];
  const steps=items.map((it,i)=>{const done=it.cleared||S.cAck[S.docId+it.id];return `<button data-step="${i}" aria-current="${i===S.cStep}" class="${done?"done":""}"><span class="tick">${done?"✓":""}</span><span><span style="display:block;font-weight:${i===S.cStep?600:400}">${esc(it.title)}</span>${it.cleared?`<span class="conf">cleared by a correction</span>`:it.f?`<span class="conf">${it.f.sev}</span>`:""}</span></button>`}).join("");
  let main="", hl=[];
  if(cur.kind==="fail") main=failedView(d,s);
  else if(cur.kind==="gate"){
    hl=["hdr.amount_total"];
    main=`<h2>${esc(cur.title)}</h2>${cur.cleared?`<p class="chip ok" style="margin-top:8px">cleared by a correction</p>`:""}<p class="mono" style="margin-top:12px">${esc(cur.rule?.detail||"")}</p>
      <p class="muted" style="margin-top:10px">The gate compares the reading with itself. Check the highlighted value on the page.</p>
      ${fixControls(s,"hdr.amount_total","Total",s.reading.hdr.amount_total,s.reading.cur.amount_total)}
      <div class="c-actions"><button class="btn" data-act="next" data-ack="${cur.id}">The reading is right</button></div>`;
  } else if(cur.kind==="finding"){
    const f=cur.f;
    if(!f){main=`<h2>${esc(cur.title)}</h2><p class="chip ok" style="margin-top:8px">cleared by a correction</p><div class="c-actions"><button class="btn" data-act="next">Next</button></div>`;}
    else{
      hl=hlFor(f,s);
      const tgt=f.key==="hdr"?`hdr.${f.cell}`:f.key?`line.${f.key}.${f.cell}`:null;
      const l=f.key&&f.key!=="hdr"?s.reading.lines.find(x=>x.key===f.key):null;
      main=`<div class="row-flex">${sevChip(f)}<h2>${esc(cur.title)}</h2></div>
        <div class="cmp">${f.poV!=null?`<span class="label">Purchase order</span><span class="v">${esc(f.poV)}</span>`:""}${f.recV!=null?`<span class="label">Received</span><span class="v">${esc(f.recV)}</span>`:""}${f.invV!=null?`<span class="label">Invoice, as read</span><span class="v">${esc(f.invV)}</span>`:""}</div>
        <p class="muted">${esc(f.expl)}</p>
        ${tgt&&l?fixControls(s,tgt,"Invoice value",l.read?.[f.cell],l.cur[f.cell]):""}
        <div class="c-actions"><button class="btn" data-act="next" data-ack="${cur.id}">${f.sev==="note"?"Noted":"The reading is right"}</button></div>
        <p class="conf" style="margin-top:10px">A real discrepancy is decided at the end, not corrected. Only the invoice's reading can be fixed.</p>`;
    }
  } else {
    const corr=corrections(s), g=s.reading?gate(s):null, m=s.reading?match(d,s):null;
    main=`<h2>Decide</h2>
      ${s.reading?`<p style="margin-top:10px">Now: gate <b>${g.result}</b>, match <b>${m.verdict}</b>. ${m.findings.filter(f=>f.sev==="hold").length} hold, ${m.findings.filter(f=>f.sev==="note").length} note.</p>`:""}
      <h3 style="margin-top:16px">Corrections</h3>${corr.length?`<table style="margin-top:6px"><tbody>${corr.map(c=>`<tr><td style="padding:6px">${esc(c.what)}</td><td class="mono muted" style="padding:6px;text-decoration:line-through">${esc(c.read)}</td><td class="mono" style="padding:6px">${esc(c.now)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">None. The reading stands as read.</p>`}
      <div style="margin-top:16px">${s.reading?decideBar(d,s,"row-flex"):""}</div>`;
  }
  return `<div class="row-flex" style="justify-content:space-between;margin-bottom:14px"><h1>${esc(d.page.vendor)} <span class="mono muted">${esc(d.page.invoice_id)}</span></h1>${statusChip(s)}</div>
    <div class="c-grid"><nav class="steps" aria-label="Review steps">${steps}</nav>
    <div class="c-main"><section class="stack">${main}</section><div>${paper(d,hl)}</div></div></div>`;
}
function fixControls(s,target,label,read,cur){
  if(s.decided) return "";
  return `<div class="fixrow"><label class="label" for="fix-${target}">${esc(label)}</label><input id="fix-${target}" data-t="${target}" value="${esc(cur)}" spellcheck="false">${read!==cur?`<span class="conf">read <s>${esc(read)}</s></span>`:""}</div>`;
}

// ---------- page shell ----------
const VARIANTS={D:["Chosen: ledger + page",renderD],A:["Split",renderA],B:["Ledger",renderB],C:["Walk-through",renderC]};
S.variant="D";
function render(){
  const d=doc(), s=st();
  const queue=DOCS.map(x=>{const xs=S.docs[x.id];return `<button data-doc="${x.id}" aria-current="${x.id===S.docId}"><span class="mono">${esc(x.page.invoice_id)}</span>${statusChip(xs)}</button>`}).join("");
  const meta=`<span class="chip">${esc(d.file)}</span><span class="chip">${d.backend}</span><span class="chip">$${d.cost.toFixed(4)}</span>${d.ms?`<span class="chip">${(d.ms/1000).toFixed(1)} s</span>`:""}`;
  const body=VARIANTS[S.variant][1](d,s);
  const corr=corrections(s);
  const state=`<details class="state"><summary>State (prototype): status, routing reasons, edits, corrections, transitions</summary><div class="state-grid">
    <pre>${esc(JSON.stringify({status:s.status,routed_with:routedWith(s),reasons_now:reasons(d,s).map(r=>r.kind),gate:s.reading?gate(s).result:null,match:s.reading?match(d,s).verdict:null},null,2))}</pre>
    <pre>${esc(JSON.stringify({corrections_net:corr,settled:s.settled},null,2))}</pre>
    <pre>${esc(JSON.stringify({edits_append_only:s.edits},null,2))}</pre>
    <pre>${esc(JSON.stringify({transitions:s.transitions},null,2))}</pre></div></details>`;
  document.getElementById("app").innerHTML=`<div class="top"><div class="brand">docmatch <span class="label">review</span></div><div class="queue" aria-label="Documents in review">${queue}</div><div class="docmeta">${meta}</div></div>${body}${state}`;
  document.getElementById("app").classList.toggle("sheet-open",S.sheet);
  let sw=document.getElementById("sw"); if(!sw){sw=document.createElement("div");sw.id="sw";document.body.appendChild(sw);}
  sw.innerHTML=`<div class="switcher" role="toolbar" aria-label="Prototype variant"><button data-sw="-1" aria-label="Previous variant">‹</button><span class="lbl"><span class="tag">${S.variant}</span>${VARIANTS[S.variant][0]}</span><button data-sw="1" aria-label="Next variant">›</button></div>`;
}
document.addEventListener("change",e=>{const t=e.target.closest("[data-t]");if(t)setValue(t.dataset.t,t.value.trim())});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("[data-t]")){e.target.blur();return}
  if(e.target.closest("input,textarea,[contenteditable]"))return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight")cycle(e.key==="ArrowRight"?1:-1);
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-doc],[data-act],[data-rm],[data-sw],[data-step],.find[data-k]");if(!b)return;
  if(b.dataset.doc){S.confirm=null;S.docId=b.dataset.doc;S.focus=null;S.cStep=0;S.sheet=false;render();return}
  if(b.dataset.sw){cycle(+b.dataset.sw);return}
  if(b.dataset.rm){removeLine(b.dataset.rm);return}
  if(b.dataset.step){S.cStep=+b.dataset.step;render();return}
  if(b.classList.contains("find")){const m=match(doc(),st());S.focus=m.findings[+b.dataset.fi];render();return}
  const a=b.dataset.act;
  if(a==="approve"){if(openItems(doc(),st()).length&&S.confirm!==S.docId){S.confirm=S.docId;render()}else decide("approved")}
  else if(a==="confirm"){S.confirm=null;decide("approved")} else if(a==="cancel"){S.confirm=null;render()} else if(a==="reject")decide("rejected"); else if(a==="undo")undoDecision();
  else if(a==="addline")addLine(); else if(a==="sheet"){S.sheet=!S.sheet;render()}
  else if(a==="next"){if(b.dataset.ack)S.cAck[S.docId+b.dataset.ack]=true;S.cStep++;render()}
});
function cycle(k){const keys=Object.keys(VARIANTS);S.variant=keys[(keys.indexOf(S.variant)+k+keys.length)%keys.length];S.sheet=false;try{localStorage.setItem("proto-variant",S.variant)}catch(_){};render()}
try{const v=localStorage.getItem("proto-variant");if(v&&VARIANTS[v])S.variant=v}catch(_){}
const h=location.hash.slice(1).toUpperCase();if(VARIANTS[h])S.variant=h;
render();
</script>
